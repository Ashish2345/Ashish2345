<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" width="880" height="530" role="img" aria-label="Aashish Rayamajhi — full-stack and AI/ML engineer">
  <defs>
    <style>
      .m   { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .lbl { fill:#4dd0e1; font-size:11.5px; }
      .val { fill:#dbe4ee; font-size:11.5px; }
      .cap { fill:#2e8b9e; font-size:9.5px; letter-spacing:1.6px; }
      .node{ fill:#0c2030; stroke:#1e5a72; stroke-width:1; }
      .nt  { fill:#9fd8e6; font-size:9.5px; letter-spacing:0.8px; }
      .sub { fill:#4a6b85; font-size:7.5px; letter-spacing:0.5px; }
      .link{ stroke:#1e4a6d; stroke-width:1.3; fill:none; }
      .led { stroke:#24415f; stroke-dasharray:1.5 3; }
    </style>
    <clipPath id="typeClip">
      <rect x="310" y="18" width="0" height="24">
        <animate attributeName="width" from="0" to="262" begin="0.2s" dur="0.95s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="8" y="8" width="864" height="514" rx="12" fill="#0a121e" stroke="#17314f"/>

  <!-- ── title bar : types itself in ── -->
  <circle cx="34" cy="30" r="5.5" fill="#ff5f57"/>
  <circle cx="53" cy="30" r="5.5" fill="#febc2e"/>
  <circle cx="72" cy="30" r="5.5" fill="#28c840"/>

  <g clip-path="url(#typeClip)">
    <text class="m" x="440" y="34" fill="#5d7793" font-size="12" text-anchor="middle">aashish@dev ~ % ./profile.sh --live</text>
  </g>
  <rect y="23" width="6" height="13" fill="#5d7793" x="314">
    <animate attributeName="x" from="314" to="570" begin="0.2s" dur="0.95s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="1.15s" dur="0.25s" fill="freeze"/>
  </rect>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.3s" fill="freeze"/>
    <circle cx="790" cy="30" r="3.5" fill="#ff9f43">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <text class="m" x="802" y="34" fill="#ff9f43" font-size="10" letter-spacing="1.4">ONLINE</text>
  </g>
  <line x1="8" y1="52" x2="872" y2="52" stroke="#17314f"/>

  <!-- ══════════ left : domain map ══════════ -->
  <text class="m cap" x="40" y="74">DOMAIN.MAP</text>
  <rect x="28" y="82" width="332" height="418" rx="8" fill="#08101a" stroke="#17314f"/>

  <!-- spokes draw themselves outward -->
  <g class="link">
    <path d="M194 240 L194 120" stroke-dasharray="120" stroke-dashoffset="120"><animate attributeName="stroke-dashoffset" to="0" begin="0.55s" dur="0.45s" fill="freeze"/></path>
    <path d="M194 240 L308 203" stroke-dasharray="120" stroke-dashoffset="120"><animate attributeName="stroke-dashoffset" to="0" begin="0.63s" dur="0.45s" fill="freeze"/></path>
    <path d="M194 240 L265 337" stroke-dasharray="120" stroke-dashoffset="120"><animate attributeName="stroke-dashoffset" to="0" begin="0.71s" dur="0.45s" fill="freeze"/></path>
    <path d="M194 240 L123 337" stroke-dasharray="120" stroke-dashoffset="120"><animate attributeName="stroke-dashoffset" to="0" begin="0.79s" dur="0.45s" fill="freeze"/></path>
    <path d="M194 240 L80 203"  stroke-dasharray="120" stroke-dashoffset="120"><animate attributeName="stroke-dashoffset" to="0" begin="0.87s" dur="0.45s" fill="freeze"/></path>
  </g>

  <!-- pulses, running forever once the map is drawn -->
  <g fill="#5ee7f5" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.4s" fill="freeze"/>
    <circle r="2.4"><animateMotion dur="2.8s" begin="1.5s" repeatCount="indefinite" path="M194 240 L194 120"/></circle>
    <circle r="2.4"><animateMotion dur="2.8s" begin="2.05s" repeatCount="indefinite" path="M194 240 L308 203"/></circle>
    <circle r="2.4"><animateMotion dur="2.8s" begin="2.6s" repeatCount="indefinite" path="M194 240 L265 337"/></circle>
    <circle r="2.4"><animateMotion dur="2.8s" begin="3.15s" repeatCount="indefinite" path="M194 240 L123 337"/></circle>
    <circle r="2.4"><animateMotion dur="2.8s" begin="3.7s" repeatCount="indefinite" path="M194 240 L80 203"/></circle>
  </g>

  <!-- hub -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.35s" dur="0.35s" fill="freeze"/>
    <circle cx="194" cy="240" r="44" fill="#0c2030" stroke="#4dd0e1" stroke-width="1.4"/>
    <circle cx="194" cy="240" r="44" fill="none" stroke="#4dd0e1" stroke-width="1.4">
