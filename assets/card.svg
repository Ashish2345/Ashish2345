      <text class="lbl" x="404" y="352">Core.Cloud</text><line class="led" x1="530" y1="348" x2="572" y2="348"/>
      <text class="val" x="580" y="352">AWS, GCP, Docker, Kubernetes</text></g>

    <g opacity="0"><animate attributeName="opacity" to="1" begin="1.58s" dur="0.28s" fill="freeze"/>
