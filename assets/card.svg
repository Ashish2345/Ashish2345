      <text class="val" x="580" y="420">ashishrayamajhi227@gmail.com</text></g>

    <g opacity="0"><animate attributeName="opacity" to="1" begin="1.76s" dur="0.28s" fill="freeze"/>
      <text class="lbl" x="404" y="438">Grid Portfolio</text><line class="led" x1="530" y1="434" x2="572" y2="434"/>
      <text class="val" x="580" y="438">ashish12.com.np</text></g>

    <g opacity="0"><animate attributeName="opacity" to="1" begin="1.815s" dur="0.28s" fill="freeze"/>
      <text class="lbl" x="404" y="456">Grid LinkedIn</text><line class="led" x1="530" y1="452" x2="572" y2="452"/>
      <text class="val" x="580" y="456">aashish-rayamajhi-a453011ba</text></g>

    <g opacity="0"><animate attributeName="opacity" to="1" begin="1.87s" dur="0.28s" fill="freeze"/>
      <text class="lbl" x="404" y="474">Grid Github</text><line class="led" x1="530" y1="470" x2="572" y2="470"/>
      <text class="val" x="580" y="474">Ashish2345</text></g>
